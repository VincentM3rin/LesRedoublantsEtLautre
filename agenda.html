<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agenda</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <style>
        .agenda-grid {
            display: grid;
            grid-template-columns: 60px repeat(5, minmax(150px, 1fr));
            grid-template-rows: 40px repeat(16, 50px);
            gap: 4px;
            overflow-x: auto;
        }

        .day-header {
            font-weight: bold;
            text-align: center;
            background: #f5f5f5;
            padding: 8px;
            position: sticky;
            top: 0;
        }

        .hour-label {
            text-align: right;
            padding-right: 10px;
            color: #7a7a7a;
            font-size: 0.85rem;
        }

        .event {
            margin: 0 !important;
            padding: 0.5rem !important;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <section class="section">
        <div class="container">
            <h1 class="title">Agenda</h1>

            <div class="agenda-grid">
                <div></div>
                <div class="day-header" style="grid-column: 2;">Lundi</div>
                <div class="day-header" style="grid-column: 3;">Mardi</div>
                <div class="day-header" style="grid-column: 4;">Mercredi</div>
                <div class="day-header" style="grid-column: 5;">Jeudi</div>
                <div class="day-header" style="grid-column: 6;">Vendredi</div>

                
                <div class="hall-header" style="grid-column: 2;">Hall 1</div>
                <div class="hall-header" style="grid-column: 3;">Hall 2</div>
                
                <div class="hall-header" style="grid-column: 4;">Hall 1</div>
                <div class="hall-header" style="grid-column: 5;">Hall 2</div>

                <div class="hall-header" style="grid-column: 6;">Hall 1</div>
                <div class="hall-header" style="grid-column: 7;">Hall 2</div>

                <div class="hall-header" style="grid-column: 8;">Hall 1</div>
                <div class="hall-header" style="grid-column: 9;">Hall 2</div>

                <div class="hall-header" style="grid-column: 10;">Hall 1</div>
                <div class="hall-header" style="grid-column: 11;">Hall 2</div>

                <div class="hour-label" style="grid-row: 2;">8h</div>
                <div class="hour-label" style="grid-row: 3;">9h</div>
                <div class="hour-label" style="grid-row: 4;">10h</div>
                <div class="hour-label" style="grid-row: 5;">11h</div>
                <div class="hour-label" style="grid-row: 6;">12h</div>
                <div class="hour-label" style="grid-row: 7;">13h</div>
                <div class="hour-label" style="grid-row: 8;">14h</div>
                <div class="hour-label" style="grid-row: 9;">15h</div>
                <div class="hour-label" style="grid-row: 10;">16h</div>
                <div class="hour-label" style="grid-row: 11;">17h</div>
                <div class="hour-label" style="grid-row: 12;">18h</div>
                <div class="hour-label" style="grid-row: 13;">19h</div>
                <div class="hour-label" style="grid-row: 14;">20h</div>
                <div class="hour-label" style="grid-row: 15;">21h</div>
                <div class="hour-label" style="grid-row: 16;">22h</div>
                <div class="hour-label" style="grid-row: 17;">23h</div>

                <article class="notification is-primary event" style="grid-column: 4; grid-row: 2 / 4;">
                    <p class="title is-size-6">Test 1</p>
                    <p class="subtitle is-size-7">8:00 - 10:00</p>
                </article>

                <article class="notification is-info event" style="grid-column: 3; grid-row: 5 / 8;">
                    <p class="title is-size-6">Test 2</p>
                    <p class="subtitle is-size-7">11:00 - 14:00</p>
                </article>

                <article class="notification is-link event" style="grid-column: 6; grid-row: 12 / 13;">
                    <p class="title is-size-6">Test 3</p>
                    <p class="subtitle is-size-7">18:00 - 19:00</p>
                </article>
            </div>
        </div>
    </section>
</body>
</html>
